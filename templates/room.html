<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WParty | Комната {{ room_id }}</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --bg: #0f111a; --panel: #1a1d2e; --accent: #4a6ee0; --text: #fff; --dim: #8b92a5; --border: #2a2f45; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Шапка */
        header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--bg); border-bottom: 1px solid var(--border); z-index: 10; }
        .logo { font-weight: 900; font-size: 20px; color: var(--accent); display: flex; align-items: center; gap: 8px; letter-spacing: 1px; }
        .logo span { color: var(--text); }
        
        .video-input-area { display: flex; gap: 10px; flex: 1; max-width: 600px; margin: 0 20px; }
        .video-input-area input { flex: 1; background: var(--panel); border: 1px solid var(--border); padding: 10px 15px; border-radius: 6px; color: var(--text); font-size: 13px; outline: none; }
        .video-input-area button { background: var(--panel); border: 1px solid var(--border); padding: 0 15px; border-radius: 6px; color: var(--text); cursor: pointer; }
        .video-input-area button:hover { background: var(--border); }
        .video-input-area input:disabled { opacity: 0.5; }
        
        .user-area { display: flex; align-items: center; gap: 12px; }
        .btn-session { background: var(--panel); border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; color: var(--text); font-size: 13px; font-weight: 600; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #4a6ee0, #8b5cf6); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; }

        /* Основная зона */
        main { display: flex; flex: 1; overflow: hidden; }
        .video-container { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
        video { width: 100%; height: 100%; max-height: 100vh; background: #000; outline: none; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Чат */
        .sidebar { width: 360px; background: var(--panel); display: flex; flex-direction: column; border-left: 1px solid var(--border); }
        .sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); }
        .tab { flex: 1; text-align: center; padding: 15px; font-weight: 600; font-size: 14px; color: var(--dim); cursor: pointer; }
        .tab.active { color: var(--text); border-bottom: 2px solid var(--accent); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .msg { display: flex; gap: 12px; position: relative; }
        .msg-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; font-size: 14px; }
        .msg-body { flex: 1; }
        .msg-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .msg-name { font-weight: 700; font-size: 13px; color: var(--text); }
        .msg-time { font-size: 11px; color: var(--dim); }
        .msg-text { font-size: 14px; line-height: 1.4; color: #cbd5e1; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 0 12px 12px 12px; display: inline-block; }
        .sys-msg { text-align: center; font-size: 12px; color: var(--dim); margin: 10px 0; }
        .reactions { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
        .reaction-badge { background: var(--bg); border: 1px solid var(--border); padding: 2px 6px; border-radius: 99px; font-size: 12px; }
        .react-menu { position: absolute; right: 0; top: -35px; background: var(--panel); border: 1px solid var(--border); border-radius: 99px; display: none; gap: 5px; padding: 5px 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 10; }
        .msg:hover .react-menu { display: flex; }
        .react-menu span { cursor: pointer; font-size: 18px; transition: 0.2s; }
        .react-menu span:hover { transform: scale(1.3); }
        .chat-input-area { padding: 15px; border-top: 1px solid var(--border); }
        .chat-input-box { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 5px 5px 5px 15px; }
        .chat-input-box input { flex: 1; background: transparent; border: none; color: var(--text); outline: none; font-size: 14px; }
        .chat-input-box button { background: var(--accent); border: none; width: 36px; height: 36px; border-radius: 6px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Настройки */
        .settings-area { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .setting-item label { font-size: 13px; color: var(--dim); font-weight: 600; margin-bottom: 8px; display: block; }
        .copy-box { display: flex; gap: 10px; }
        .copy-box input { flex: 1; background: var(--bg); border: 1px solid var(--border); padding: 10px; border-radius: 6px; color: var(--text); font-size: 13px; }
        .copy-box button { background: var(--accent); border: none; padding: 0 15px; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }

        .tab-content { flex: 1; display: none; flex-direction: column; overflow: hidden; }
        .tab-content.active { display: flex; }
        #error-banner { position: fixed; top: 0; left: 0; width: 100%; background: #ef4444; color: white; text-align: center; padding: 10px; font-weight: bold; z-index: 999; display: none; }

        /* Модальное окно ввода имени */
        #name-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: var(--panel); padding: 30px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; border: 1px solid var(--border); }
        .modal-box h2 { margin-bottom: 20px; font-size: 20px; }
        .modal-box input { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: white; margin-bottom: 15px; outline: none; }
        .modal-box button { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }

        @media (max-width: 800px) {
            main { flex-direction: column; }
            .video-container { flex: none; height: 40vh; }
            .sidebar { width: 100%; flex: 1; border-left: none; border-top: 1px solid var(--border); }
            .video-input-area { display: none; }
        }
    </style>
</head>
<body>

    <!-- Модальное окно ввода имени (появится, если нет ника) -->
    <div id="name-modal" style="display: none;">
        <div class="modal-box">
            <h2>Введите ваш никнейм</h2>
            <input type="text" id="name-input" placeholder="Например: Киноман" maxlength="15">
            <button onclick="submitName()">Войти в комнату</button>
        </div>
    </div>

    <div id="error-banner">⚠️ Нет соединения с сервером. Обновите страницу.</div>

    <header>
        <div class="logo">▶ <span>WPARTY</span></div>
        
        <div class="video-input-area">
            <input type="text" id="video-url" placeholder="Ссылка на MP4, Rutube, VK или YouTube">
            <button id="load-btn">Загрузить</button>
        </div>

        <div class="user-area">
            <div class="btn-session" id="role-badge">Подключение...</div>
            <div class="avatar" id="my-avatar">?</div>
        </div>
    </header>

    <main>
        <div class="video-container" id="video-container">
            <video id="player" controls crossorigin="anonymous"></video>
        </div>

        <div class="sidebar">
            <div class="sidebar-tabs">
                <div class="tab active" onclick="switchTab('chat')">Чат</div>
                <div class="tab" onclick="switchTab('settings')">Настройки</div>
            </div>
            
            <div id="tab-chat" class="tab-content active">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-area">
                    <div class="chat-input-box">
                        <input type="text" id="chat-input" placeholder="Введите сообщение..." autocomplete="off">
                        <button id="send-btn">➤</button>
                    </div>
                </div>
            </div>

            <div id="tab-settings" class="tab-content">
                <div class="settings-area">
                    <div class="setting-item">
                        <label>Пригласительная ссылка</label>
                        <p style="font-size: 12px; color: var(--dim); margin-bottom: 10px;">Отправьте эту ссылку другу, чтобы он подключился к просмотру.</p>
                        <div class="copy-box">
                            <input type="text" id="invite-link" readonly>
                            <button onclick="copyLink()">Копировать</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const roomId = "{{ room_id }}";
        let myNickname = "{{ nickname }}"; // Сюда придет либо ник, либо "None"
        const socket = io();
        let isHost = false;
        let currentPlatform = '';
        
        // Функция запуска сайта (вызывается после ввода ника)
        function startApp() {
            document.getElementById('my-avatar').innerText = myNickname[0].toUpperCase();
            
            // Генерируем чистую ссылку БЕЗ ?nickname=...
            const url = new URL(window.location.href);
            url.searchParams.delete('nickname');
            document.getElementById('invite-link').value = url.toString();

            socket.on('connect', () => {
                document.getElementById('error-banner').style.display = 'none';
                socket.emit('join', { room: roomId, nickname: myNickname });
            });

            socket.on('disconnect', () => {
                document.getElementById('error-banner').style.display = 'block';
            });
            
            // ... (остальной код сокетов и плеера, он ниже)
            initSockets();
            initPlayer();
        }

        // Проверка: если зашли по чистой ссылке (без ника) — показываем окно
        if (myNickname === 'None' || myNickname === '' || !myNickname) {
            document.getElementById('name-modal').style.display = 'flex';
            document.getElementById('name-input').focus();
        } else {
            startApp();
        }

        // Сохранение ника из модального окна
        function submitName() {
            const val = document.getElementById('name-input').value.trim();
            if (val) {
                myNickname = val;
                document.getElementById('name-modal').style.display = 'none';
                startApp();
            }
        }

        document.getElementById('name-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitName();
        });

        // --- ВСЯ ЛОГИКА СИНХРОНИЗАЦИИ И ЧАТА ---
        function initSockets() {
            socket.on('you_are_host', (data) => {
                isHost = data.is_host;
                const badge = document.getElementById('role-badge');
                const urlInput = document.getElementById('video-url');
                const loadBtn = document.getElementById('load-btn');

                if (isHost) {
                    badge.innerText = "Создатель";
                    badge.style.color = "#4ade80";
                    urlInput.disabled = false;
                    loadBtn.disabled = false;
                } else {
                    badge.innerText = "Зритель";
                    badge.style.color = "#8b92a5";
                    urlInput.disabled = true;
                    loadBtn.disabled = true;
                }
                if (data.video_url) loadVideo(data.video_url);
            });

            document.getElementById('load-btn').addEventListener('click', () => {
                const url = document.getElementById('video-url').value;
                if (url && isHost) socket.emit('set_video', { room: roomId, url: url });
            });

            socket.on('video_changed', (data) => {
                loadVideo(data.url);
                document.getElementById('video-url').value = data.url;
            });

            socket.on('sync', (data) => {
                if (currentPlatform === 'direct' && player) {
                    isRemoteAction = true;
                    if (Math.abs(player.currentTime - data.time) > 0.5) player.currentTime = data.time;
                    if (data.action === 'play') player.play();
                    if (data.action === 'pause') player.pause();
                    setTimeout(() => { isRemoteAction = false; }, 300);
                } 
                else if (currentPlatform === 'rutube' && iframePlayer) {
                    if (data.action === 'play') iframePlayer.contentWindow.postMessage(JSON.stringify({ type: 'player:play', data: {} }), '*');
                    else if (data.action === 'pause') iframePlayer.contentWindow.postMessage(JSON.stringify({ type: 'player:pause', data: {} }), '*');
                    else if (data.action === 'seek') iframePlayer.contentWindow.postMessage(JSON.stringify({ type: 'player:seek', data: { time: data.time } }), '*');
                }
                else if (currentPlatform === 'vk' && iframePlayer) {
                    if (data.action === 'play') iframePlayer.contentWindow.postMessage('play', '*');
                    else if (data.action === 'pause') iframePlayer.contentWindow.postMessage('pause', '*');
                }
            });

            // ЧАТ
            const chatBox = document.getElementById('chat-messages');
            const chatInput = document.getElementById('chat-input');

            function sendMsg() {
                const text = chatInput.value.trim();
                if (text) {
                    socket.emit('chat', { room: roomId, nickname: myNickname, text: text });
                    chatInput.value = '';
                }
            }

            document.getElementById('send-btn').addEventListener('click', sendMsg);
            chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMsg(); });

            socket.on('chat', (data) => {
                const el = document.createElement('div');
                el.className = 'msg';
                el.id = `msg-${data.msg_id}`;
                el.innerHTML = `
                    <div class="msg-avatar" style="background: ${getColor(data.nickname)}">${data.nickname[0].toUpperCase()}</div>
                    <div class="msg-body">
                        <div class="msg-head">
                            <span class="msg-name">${data.nickname}</span>
                            <span class="msg-time">${data.time}</span>
                        </div>
                        <div class="msg-text">${data.text}</div>
                        <div class="reactions" id="reacts-${data.msg_id}"></div>
                    </div>
                    <div class="react-menu">
                        <span onclick="sendReact('${data.msg_id}', '👍')">👍</span>
                        <span onclick="sendReact('${data.msg_id}', '❤️')">❤️</span>
                        <span onclick="sendReact('${data.msg_id}', '😂')">😂</span>
                        <span onclick="sendReact('${data.msg_id}', '🔥')">🔥</span>
                    </div>
                `;
                chatBox.appendChild(el);
                chatBox.scrollTop = chatBox.scrollHeight;
            });

            socket.on('system_message', (data) => {
                const el = document.createElement('div');
                el.className = 'sys-msg';
                el.innerText = data.text;
                chatBox.appendChild(el);
                chatBox.scrollTop = chatBox.scrollHeight;
            });

            // Реакции
            window.sendReact = function(msgId, emoji) {
                socket.emit('react', { room: roomId, msg_id: msgId, emoji: emoji });
            }

            socket.on('react', (data) => {
                const box = document.getElementById(`reacts-${data.msg_id}`);
                if (box) {
                    let existing = Array.from(box.children).find(el => el.innerText.includes(data.emoji));
                    if (existing) {
                        let count = parseInt(existing.innerText.replace(data.emoji, '').trim()) || 1;
                        existing.innerText = `${data.emoji} ${count + 1}`;
                    } else {
                        const badge = document.createElement('div');
                        badge.className = 'reaction-badge';
                        badge.innerText = `${data.emoji} 1`;
                        box.appendChild(badge);
                    }
                }
            });
        }

        // --- ПЛЕЕР ---
        const videoContainer = document.getElementById('video-container');
        let player = document.getElementById('player');
        let iframePlayer = null;
        let isRemoteAction = false;
        let hls;

        function initPlayer() {
            // Первичная инициализация при загрузке
        }

        function loadVideo(url) {
            videoContainer.innerHTML = '';
            if (hls) { hls.destroy(); hls = null; }
            iframePlayer = null;

            if (url.includes('rutube.ru')) {
                currentPlatform = 'rutube';
                let videoId = url.split('/').pop().split('?')[0];
                iframePlayer = document.createElement('iframe');
                iframePlayer.src = `https://rutube.ru/play/embed/${videoId}/?api=1`;
                iframePlayer.allow = "clipboard-write; autoplay; fullscreen";
                videoContainer.appendChild(iframePlayer);
            }
            else if (url.includes('vk.com') || url.includes('vkvideo.ru')) {
                currentPlatform = 'vk';
                let videoId = url.split('/').pop().split('?')[0]; 
                let oid = videoId.split('_')[0].replace('video', '').replace('-', '');
                let id = videoId.split('_')[1] || videoId;
                iframePlayer = document.createElement('iframe');
                iframePlayer.src = `https://vk.com/video_ext.php?oid=-${oid}&id=${id}&hd=2&autoplay=0`;
                iframePlayer.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture";
                videoContainer.appendChild(iframePlayer);
            }
            else {
                currentPlatform = 'direct';
                player = document.createElement('video');
                player.controls = true;
                player.crossOrigin = "anonymous";
                player.style.width = "100%";
                player.style.height = "100%";
                videoContainer.appendChild(player);

                if (url.includes('.m3u8') && Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(player);
                } else {
                    player.src = url;
                }
                player.load();

                player.addEventListener('play', () => { if (!isRemoteAction) socket.emit('sync', { room: roomId, action: 'play', time: player.currentTime }); });
                player.addEventListener('pause', () => { if (!isRemoteAction) socket.emit('sync', { room: roomId, action: 'pause', time: player.currentTime }); });
                player.addEventListener('seeked', () => { if (!isRemoteAction) socket.emit('sync', { room: roomId, action: 'seek', time: player.currentTime }); });
            }
        }

        // --- УТИЛИТЫ ---
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if (tabName === 'chat') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('tab-chat').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('tab-settings').classList.add('active');
            }
        }

        function copyLink() {
            const input = document.getElementById('invite-link');
            input.select();
            document.execCommand("copy");
            alert("Ссылка скопирована! Отправьте её другу.");
        }

        function getColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            const c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
            return "#" + "00000".substring(0, 6 - c.length) + c;
        }
    </script>
</body>
</html>
